# Aplikacja
spring.application.name=braggly

# Konfiguracja serwera
server.port=${SERVER_PORT}

# Konfiguracja bazy danych
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# Bounded COD/CIF work. CIF limit is >14x the largest current B2 CIF (2,243,835 bytes).
cod.import.batch-size=500
cod.import.connect-timeout-ms=15000
cod.import.read-timeout-ms=60000
cif.max-file-bytes=33554432
cif.max-atoms=100000
cif.max-concurrent=2
cif.connect-timeout-ms=15000
cif.read-timeout-ms=60000

# Konfiguracja bezpieczeństwa
spring.security.user.name=${ADMIN_USER}
spring.security.user.password=${ADMIN_PASSWORD}

# Konfiguracja Hibernate / JPA
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# Logowanie
#logging.file.name=${LOGGING_FILE:/opt/braggly/backend/logs/spring.log}
logging.file.name=${LOGGING_FILE:}

logging.level.root=INFO

# Logowanie zapytań HTTP (Spring Web, Security, Hibernate)
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.apache.coyote.http11=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO

# Konfiguracja actuatora (monitorowanie)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs

spring.jpa.open-in-view=false

stripe.secret.key=${SECRET_STRIPE}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

jwt.secret=${JWT_SECRET}

cloud.b2.bucket=${B2_BUCKET_NAME}
cloud.b2.endpoint=${B2_ENDPOINT}
cloud.b2.region=${B2_REGION}
cloud.b2.access-key=${B2_ACCESS_KEY}
cloud.b2.secret-key=${B2_SECRET_KEY}

spring.flyway.baseline-on-migrate=true

# Parametry modelu (domyślnie: gpt-4o-mini)
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Temperatura odpowiedzi (domyślnie: 0.7)
openai.temperature=${OPENAI_TEMPERATURE:0.7}

# Maksymalna liczba tokenów (domyślnie: 1000)
openai.max-tokens=${OPENAI_MAX_TOKENS:1000}
